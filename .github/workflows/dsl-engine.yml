name: DSL Engine CI

on:
  push:
    paths:
      - 'crates/dsl-engine/**'
  pull_request:
    paths:
      - 'crates/dsl-engine/**'

defaults:
  run:
    working-directory: crates/dsl-engine

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/dsl-engine
      - name: Run Rust tests
        run: cargo test --lib

  wasm-build:
    runs-on: ubuntu-latest
    needs: rust-tests
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/dsl-engine
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build WASM package
        run: wasm-pack build --target web --out-dir pkg
      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsl-engine-wasm
          path: crates/dsl-engine/pkg/

  pyo3-build:
    runs-on: ubuntu-latest
    needs: rust-tests
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/dsl-engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install maturin
        run: pip install maturin
      - name: Build PyO3 wheel
        run: maturin build --features python --release --out dist
        working-directory: crates/dsl-engine
      - name: Upload PyO3 wheel
        uses: actions/upload-artifact@v4
        with:
          name: dsl-engine-wheel
          path: crates/dsl-engine/dist/*.whl
