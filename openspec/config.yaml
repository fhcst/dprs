schema: spec-driven

context: |
  Tech stack: Python 3.13+, FastAPI, Beanie (async MongoDB ODM), MongoDB 8.0, Redis 7
  DSL Engine: Rust (pest PEG parser), compiled to WASM (wasm-pack) for frontend validation
  and to Python extension (PyO3 / maturin) for server-side evaluation
  Package manager: uv
  Testing: pytest + pytest-asyncio + mongomock-motor + fakeredis
  Container: Docker + Docker Compose
  Language: Traditional Chinese (繁體中文) for all AI-generated artifacts
  Conventions: kebab-case change names, spec files in English (SHALL/MUST), artifacts in 繁體中文
  Domain: educational platform — teachers manage classes, assign tasks, review submissions;
  students submit daily practice reports and earn gamification rewards (points, badges, leaderboard)
