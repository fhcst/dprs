[package]
name = "dsl-engine"
version = "1.0.0"
edition = "2021"
description = "Achievement DSL expression engine with WASM and PyO3 targets"

[lib]
# cdylib for WASM/PyO3 builds, rlib for Rust tests and library usage.
# cargo test uses rlib; wasm-pack/maturin use cdylib.
crate-type = ["cdylib", "rlib"]

[dependencies]
pest = "2.7"
pest_derive = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# PyO3 is optional — only used when building the Python extension
pyo3 = { version = "0.25", features = ["extension-module"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[dev-dependencies]
pretty_assertions = "1"

[features]
default = []
python = ["pyo3"]
