[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "dsl-engine"
version = "1.0.0"
description = "Achievement DSL expression engine — Python bindings via PyO3"
requires-python = ">=3.13"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "dsl_engine"
